  message: 'I am an old guy and seeing how the simplest thing inflate even more than our universe (https://cms.cern/physics/story-of-the-universe) could make me cry. In the past: 8kByte for a measuring device with GUI for industry and recorder for satellites. Today, for showing three files in the browser hundreds of dependencies (Scarepoint), dozens of MBytes transferred. One of my programs with 200 lines of code taken over by a company and resulting in three containers, three databases, 1.6GByte code and libraries ("generated"), startup time more than 6 minutes, 112 dependencies  thanks to Spring, dozens of frameworks and tools like "SOAP UI" instead of telnet or curl and every second build broke because of dependency problems (3 weeks per iteration by two "specialists"). Poor testing that tested that the compiler translated "a = 2 + 2" correctly, but if you have no idea, what the code is for, you cannot write tests. Best is introducing concepts without understanding them, for example XML namespace, even if not needed. If you do not know what it is and why it exists, don''t touch! Result: Buggy "solutions", impossible to install. I honestly do not understand anymore what is going on. Cool were the times when people with insight and knowing the simple concepts at the foundations. But instead of simply solving a problem, a lot of people cause big chaos, high cost, delays, projects that crash or, in the best case deliver meagre results.'
